name: Build Alarm APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Java JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Android Project Files
      run: |
        mkdir -p app/src/main/java/com/example/taskalarm
        
        # 1. build.gradle (Root)
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
        }
        EOF

        # 2. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "TaskAlarm"
        include ':app'
        EOF

        # 3. app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.example.taskalarm'
            compileSdk 33
            defaultConfig {
                applicationId "com.example.taskalarm"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
            buildFeatures { compose true }
            composeOptions { kotlinCompilerExtensionVersion '1.4.3' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.10.1'
            implementation 'androidx.activity:activity-compose:1.7.2'
            implementation platform('androidx.compose:compose-bom:2023.03.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
        }
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
            <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <application
                android:allowBackup="true"
                android:label="منبه المهام"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <activity android:name=".MathChallengeActivity" android:showOnLockScreen="true" android:turnScreenOn="true" android:exported="true" />
                <receiver android:name=".AlarmReceiver" android:exported="true" />
            </application>
        </manifest>
        EOF

        # 5. MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/example/taskalarm/MainActivity.kt
        package com.example.taskalarm
        import android.app.*
        import android.content.*
        import android.os.*
        import android.widget.Toast
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.layout.*
        import androidx.compose.material3.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.unit.dp
        import java.util.Calendar

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    MaterialTheme {
                        Surface(modifier = Modifier.fillMaxSize()) {
                            Column(
                                modifier = Modifier.fillMaxSize(),
                                horizontalAlignment = Alignment.CenterHorizontally,
                                verticalArrangement = Arrangement.Center
                            ) {
                                Text("تطبيق المنبه الذكي", style = MaterialTheme.typography.headlineMedium)
                                Spacer(modifier = Modifier.height(20.dp))
                                Button(onClick = { setAlarm(1) }) {
                                    Text("ضبط المنبه بعد دقيقة واحدة")
                                }
                            }
                        }
                    }
                }
            }
            private fun setAlarm(minutes: Int) {
                val alarmManager = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                val intent = Intent(this, AlarmReceiver::class.java)
                val pendingIntent = PendingIntent.getBroadcast(this, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                val triggerTime = Calendar.getInstance().apply { add(Calendar.MINUTE, minutes) }.timeInMillis
                alarmManager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerTime, pendingIntent)
                Toast.makeText(this, "تم ضبط المنبه!", Toast.LENGTH_SHORT).show()
            }
        }
        EOF

        # 6. AlarmReceiver.kt
        cat << 'EOF' > app/src/main/java/com/example/taskalarm/AlarmReceiver.kt
        package com.example.taskalarm
        import android.content.*

        class AlarmReceiver : BroadcastReceiver() {
            override fun onReceive(context: Context, intent: Intent) {
                val alarmIntent = Intent(context, MathChallengeActivity::class.java).apply {
                    addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                }
                context.startActivity(alarmIntent)
            }
        }
        EOF

        # 7. MathChallengeActivity.kt
        cat << 'EOF' > app/src/main/java/com/example/taskalarm/MathChallengeActivity.kt
        package com.example.taskalarm
        import android.media.*
        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.layout.*
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.unit.dp
        import kotlin.random.Random

        class MathChallengeActivity : ComponentActivity() {
            private var ringtone: Ringtone? = null
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM) ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                ringtone = RingtoneManager.getRingtone(applicationContext, alarmUri)
                ringtone?.play()
                setShowWhenLocked(true)
                setTurnScreenOn(true)

                val n1 = Random.nextInt(10, 50)
                val n2 = Random.nextInt(10, 50)
                val ans = n1 + n2

                setContent {
                    MaterialTheme {
                        Surface(modifier = Modifier.fillMaxSize()) {
                            var text by remember { mutableStateOf("") }
                            Column(
                                modifier = Modifier.fillMaxSize().padding(24.dp),
                                horizontalAlignment = Alignment.CenterHorizontally,
                                verticalArrangement = Arrangement.Center
                            ) {
                                Text("استيقظ! حل المسألة لإيقاف المنبه", style = MaterialTheme.typography.titleLarge)
                                Spacer(modifier = Modifier.height(20.dp))
                                Text("$n1 + $n2 = ?", style = MaterialTheme.typography.displayMedium)
                                OutlinedTextField(value = text, onValueChange = { text = it })
                                Spacer(modifier = Modifier.height(20.dp))
                                Button(onClick = {
                                    if (text.trim() == ans.toString()) {
                                        ringtone?.stop()
                                        finish()
                                    }
                                }) { Text("إيقاف المنبه") }
                            }
                        }
                    }
                }
            }
            override fun onDestroy() {
                super.onDestroy()
                ringtone?.stop()
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.1.1

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: TaskAlarm-APK
        path: app/build/outputs/apk/debug/app-debug.apk
